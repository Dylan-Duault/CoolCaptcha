<div id="captcha-overlay" class="captcha-overlay hidden">
    <div class="captcha-modal">
        <div class="captcha-header">
            <div>
                <h3>Select all images with <span id="captcha-target">cars</span></h3>
                <span class="verify-hint">Click verify once there are no left</span>
            </div>
        </div>
        
        <div id="captcha-step1" class="captcha-step active">    
            <div class="captcha-grid">
                <div class="captcha-image" data-index="0">
                    <img src="" alt="Captcha image 1">
                    <div class="selection-overlay"></div>
                </div>
                <div class="captcha-image" data-index="1">
                    <img src="" alt="Captcha image 2">
                    <div class="selection-overlay"></div>
                </div>
                <div class="captcha-image" data-index="2">
                    <img src="" alt="Captcha image 3">
                    <div class="selection-overlay"></div>
                </div>
                <div class="captcha-image" data-index="3">
                    <img src="" alt="Captcha image 4">
                    <div class="selection-overlay"></div>
                </div>
                <div class="captcha-image" data-index="4">
                    <img src="" alt="Captcha image 5">
                    <div class="selection-overlay"></div>
                </div>
                <div class="captcha-image" data-index="5">
                    <img src="" alt="Captcha image 6">
                    <div class="selection-overlay"></div>
                </div>
                <div class="captcha-image" data-index="6">
                    <img src="" alt="Captcha image 7">
                    <div class="selection-overlay"></div>
                </div>
                <div class="captcha-image" data-index="7">
                    <img src="" alt="Captcha image 8">
                    <div class="selection-overlay"></div>
                </div>
                <div class="captcha-image" data-index="8">
                    <img src="" alt="Captcha image 9">
                    <div class="selection-overlay"></div>
                </div>
            </div>
            
            <div class="captcha-actions">
                <button id="captcha-verify" class="captcha-button">Verify</button>
            </div>
        </div>

        <div id="captcha-step2" class="captcha-step">
            <div class="captcha-instruction">
                <p>Alternative verification method</p>
                <p class="instruction-detail">Follow the pattern with your mouse cursor</p>
            </div>
            
            <div class="captcha-pattern-area">
                <canvas id="pattern-canvas" width="400" height="300"></canvas>
                <div class="pattern-instructions">
                    <p>Draw the pattern shown above</p>
                </div>
            </div>
            
            <div class="captcha-actions">
                <button id="pattern-verify" class="captcha-button">Verify Pattern</button>
                <button id="pattern-clear" class="captcha-button secondary">Clear</button>
            </div>
        </div>

        <div class="captcha-loading hidden">
            <div class="loading-spinner"></div>
            <p>Verifying...</p>
        </div>
    </div>
</div>
